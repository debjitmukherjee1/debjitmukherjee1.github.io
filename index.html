<body data-page="home">

  <!-- First page of a visit only: a brief counter, then it wipes away. -->
  <div class="loader" aria-hidden="true"><small>Debjit Mukherjee<br>Independent equity research</small><span id="loader-n">000</span></div>

  <!-- The 3D landscape of every published call, drawn by js/home.js. -->
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main id="main">

    <!-- INTRO: name, headline, then the manifesto zooms through on scroll -->
    <section class="h-intro" id="top" aria-label="Introduction">
      <h1 class="h-word" id="h-word"></h1>
      <p class="h-line" id="h-line"></p>
      <p class="h-manifesto" id="h-manifesto"></p>
      <div class="h-status mono" id="h-status"></div>
      <div class="h-foot">
        <span class="mono h-scroll">Scroll to explore <i>↓</i></span>
        <div class="h-cta" id="h-cta"></div>
      </div>
    </section>

    <!-- CALLS: one full-screen chapter per call; the world takes the colour of the rating -->
    <section class="h-calls" id="research" aria-label="Recent calls">
      <div id="h-calls-inner"></div>
      <nav class="h-rail mono" id="h-rail" aria-label="Jump to a call"></nav>
    </section>

    <!-- RECORD: the live track record, seen from above -->
    <section class="h-rec" id="track" aria-labelledby="rec-title">
      <p class="sec-label mono" id="rec-title" style="justify-content:center">Marked to market, in public</p>
      <div id="h-record"></div>
    </section>

    <div class="tape" id="tape" role="navigation" aria-label="Latest ratings"></div>

    <!-- DEALS -->
    <section class="h-sec h-deals-sec" id="deals" aria-labelledby="deals-title">
      <div class="wrap">
        <div class="h-head"><p class="sec-label mono">Deal Decoded</p><h2 class="h-title" id="deals-title">M&amp;A, taken apart <em>line by line.</em></h2><a class="btn" href="deals" data-cursor="Go">All deals <span class="arr">↗</span></a></div>
        <div class="h-deals" id="h-deals"></div>
      </div>
    </section>

    <!-- TOOLS: scrolls sideways -->
    <section class="h-tools" id="tools" aria-label="Tools">
      <div class="h-tools-track" id="h-tools-track"></div>
    </section>

    <!-- ABOUT -->
    <section class="h-sec" id="experience" aria-labelledby="about-title">
      <div class="wrap">
        <div class="h-head"><p class="sec-label mono">The person</p><h2 class="h-title" id="about-title">Second-year student. <em>Third year of doing the work.</em></h2></div>
        <div class="h-about">
          <div>
            <h3 class="sec-label mono">Experience</h3>
            <div id="h-exp"></div>
            <h3 class="sec-label mono" id="leadership" style="margin-top:56px">Built, led and run</h3>
            <div class="h-lead" id="h-lead"></div>
          </div>
          <div class="h-collage" id="h-collage" aria-label="Photographs"></div>
        </div>
        <h3 class="sec-label mono" id="education" style="margin-top:72px">Education &amp; credentials</h3>
        <div class="h-edu" id="h-edu"></div>
      </div>
      <div class="h-skills" id="h-skills" aria-label="Skills"></div>
      <span id="credentials"></span><span id="skills"></span>
    </section>

  </main>

  <noscript><p style="padding:120px 24px;font-family:sans-serif">This site needs JavaScript to show the research library. The reports are also on <a href="https://www.linkedin.com/in/debjit-mukherjee101/">LinkedIn</a>.</p></noscript>
